services:
  backend:
    build:
      context: ./backend
    container_name: celluid-backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "3001:3001"
    volumes:
      # SQLite file (holds the system prompt) — survives rebuilds/restarts.
      - backend_data:/app/data
    networks:
      - celluid

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time (Next.js requirement for NEXT_PUBLIC_* vars).
        # "backend" here is the Docker Compose service name above — containers
        # on the same network reach each other by service name, not localhost.
        NEXT_PUBLIC_API_URL: http://backend:3001
    container_name: celluid-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - celluid

networks:
  celluid:
    driver: bridge

volumes:
  backend_data:
