services:
  backend:
    build:
      context: ./backend
    container_name: francehealth-backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "3001:3001"
    networks:
      - francehealth

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time (Next.js requirement for NEXT_PUBLIC_* vars).
        # "backend" here is the Docker Compose service name above — containers
        # on the same network reach each other by service name, not localhost.
        NEXT_PUBLIC_API_URL: http://backend:3001
    container_name: francehealth-frontend
    restart: unless-stopped
    environment:
      - JSONBIN_API_KEY=${JSONBIN_API_KEY}
      - JSONBIN_BIN_ID=${JSONBIN_BIN_ID}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - francehealth

networks:
  francehealth:
    driver: bridge
