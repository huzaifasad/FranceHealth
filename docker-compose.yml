services:
  backend:
    build:
      context: ./backend
    container_name: celluid-backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
    ports:
      # Bound to loopback only — Docker publishes ports via its own iptables
      # rules, which bypass ufw entirely, so a ufw rule alone does NOT keep
      # this off the public internet. Binding to 127.0.0.1 means Docker never
      # listens on the public interface for this port at all, regardless of
      # firewall rules. Nothing but nginx/this host needs to reach it anyway.
      - "127.0.0.1:3001:3001"
    volumes:
      # SQLite file (holds the system prompt) — survives rebuilds/restarts.
      - backend_data:/app/data
    networks:
      - celluid

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time (Next.js requirement for NEXT_PUBLIC_* vars).
        # "backend" here is the Docker Compose service name above — containers
        # on the same network reach each other by service name, not localhost.
        NEXT_PUBLIC_API_URL: http://backend:3001
    container_name: celluid-frontend
    restart: unless-stopped
    environment:
      - PROMPT_ADMIN_PASSWORD=${PROMPT_ADMIN_PASSWORD}
      - PROMPT_SESSION_SECRET=${PROMPT_SESSION_SECRET}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
    ports:
      # Same reasoning as backend above: loopback only. nginx (on the host)
      # is the actual public entry point now, proxying 80 -> 127.0.0.1:3000.
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - celluid

networks:
  celluid:
    driver: bridge

volumes:
  backend_data:
